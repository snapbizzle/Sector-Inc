name: STI-800HD
urlSlug: sti-800hd
tier: Heavy-Duty Dual-Beam Combination
tagline: A heavy-duty dual-beam combination machine for shipbuilders and bridge builders who need multiple processes on one large part.
overview: >-
  The STI-800HD is a heavy-duty, dual-beam combination machine, ideal for a manufacturer that wants
  to consolidate part processing onto one machine. It's designed to provide both precision and heft
  within a large machine envelope — perfect for shipbuilders and bridge builders who need to
  perform multiple processes on large parts. It's equipped with an advanced PC-based CNC control
  that provides an excellent motion control system, built around the High Definition Plasma Cutting
  process for ease of use, with fully automated process control for both oxy-fuel and plasma
  cutting. This versatile machine can run multiple processes, including plasma, oxy-fuel, plasma
  scribing, drilling processes (drilling, tapping, reaming, counterboring, countersinking), and
  contour bevel cutting.
heroImage: /images/machines/sti-800hd.jpg
heroImageAlt: Sector Technology STI-800HD twin-bridge dual-beam CNC combination cutting and drilling gantry.

