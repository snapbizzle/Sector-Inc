name: Gamma
urlSlug: gamma
tier: Light-Mid
tagline: The Photon concept at larger scale, built for multi-shift cutting at a medium-sized manufacturer.
overview: >-
  The Gamma shares the same concept as the Photon, only on a larger scale. The design allows for
  multiple-process cutting over multiple shifts, which is perfect for a medium-sized manufacturer
  that relies on a lot of cutting. The Gamma is constructed of an ultra-large, rigid, honeycombed
  lightweight aluminum beam with a dual side-driven gantry, and its cross-axis ways are composed of
  Bosch Rexroth profile rails. It's equipped with an advanced PC-based CNC control that provides an
  excellent motion control system, built around the High Definition Plasma Cutting process for ease
  of use. The CNC includes fully automated process control for both oxy-fuel and plasma cutting.
heroImage: /images/machines/gamma.jpg
heroImageAlt: Sector Technology Gamma CNC plasma and oxy-fuel cutting gantry on Bosch Rexroth profile rails.

