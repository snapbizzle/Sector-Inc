name: Photon
urlSlug: photon
tier: Entry-Level
tagline: A high-quality entry-level machine for a small fabricator, or a shop cutting less than 8 hours a day.
overview: >-
  The Photon is a very high quality entry-level machine, ideal for a small fabricator or a company
  that cuts less than 8 hours a day. It's constructed of a strong, rigid, honeycombed lightweight
  aluminum beam with a dual side-driven gantry. The construction is robust enough to withstand the
  daily wear and tear of heavy operation, and the cross-axis ways are made of hardened rails.
  The Photon is equipped with an advanced PC-based CNC control that provides an excellent motion
  control system, built around the High Definition Plasma Cutting process for ease of use. The CNC
  includes fully automated process control for both oxy-fuel and plasma cutting.
heroImage: /images/machines/photon.jpg
heroImageAlt: Sector Technology Photon CNC plasma and oxy-fuel cutting gantry on a shop floor, with operator control console mounted on the bridge.

specs:
