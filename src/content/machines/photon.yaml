standardEquipment:
  - Dual side-drive gantry, high-power 320-watt AC brush drive
  - Aluminum reinforced extrusion, machined linear-way bridge beam, non-unitized frame
  - Hypertherm® EDGE Pro® numerical control with USB ports
  - Rack & pinion drive with precision planetary gear boxes
  - 18 homing positions and procedures to square gantry during setup
  - Smooth and accurate motion with bearings and multiple adjustments
  - Wiper system for cleaning rails
  - Elevated 20 lbs./ft. machined "T" rails with adjustable leveling pads
  - 19-inch active matrix LCD touch screen
  - Wireless networking for CNC controller
  - Power track guide to protect hoses and cables
  - Heat shields to protect cables and hoses from sparks
  - Three-part automotive paint finish
  - Job-loss recovery

optionalEquipment:
  - Laser pointer for plate alignment
  - Hose reel with hand torch for hand cutting
  - Plasma torch collision sensor for plasma systems
  - Precision micrometer-scaled piercing valve for oxy-fuel systems
  - Plasma, pneumatic, or paint marking
  - Medium-duty water table or downdraft
  - Floor-mounted power track

dataGaps:
  - "Standard equipment lists a 320-watt AC brush drive, while every other model in the line lists an AC brushless drive at a higher wattage — confirm this is an intentional cost-reduced entry-level spec and not a legacy typo (carried over verbatim from the 2012 copy rather than silently changed)."
