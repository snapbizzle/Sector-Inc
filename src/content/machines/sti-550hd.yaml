name: STI-550HD
urlSlug: sti-550hd
tier: Precision / High-Speed
tagline: An ultra-precise, high-speed single-torch gantry for intricate profiles with tight tolerances.
overview: >-
  The STI-550HD is an ultra-precise, high-speed single-torch gantry. It's constructed of a dual
  side-driven gantry with a heavy-duty aluminum beam riding on linear rails, built with Bosch
  Rexroth high-quality precision components that let the machine run at very high acceleration
  rates while still maintaining very high part tolerances. It's equipped with an advanced PC-based
  CNC control that provides an excellent motion control system, built around the High Definition
  Plasma Cutting process for ease of use, with fully automated process control for both oxy-fuel
  and plasma cutting. This machine is ideal for a customer needing to cut intricate profiles with
  tight tolerances close to laser quality, without the large investment of a laser.
heroImage: /images/machines/sti-550hd.jpg
heroImageAlt: Sector Technology STI-550HD single-torch precision CNC plasma cutting gantry on linear rails.

