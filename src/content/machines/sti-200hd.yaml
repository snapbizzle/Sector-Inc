name: STI-200HD
urlSlug: sti-200hd
tier: Heavy-Duty / Large Fabricator
tagline: A heavy-duty precision gantry for large fabricators and steel service centers that need low maintenance over extended multi-shift runs.
overview: >-
  The STI-200HD is a heavy-duty precision gantry that travels on floor-mounted rails. It's intended
  for large fabricators and steel service centers that require a reliable machine with very low
  maintenance to run for extended periods across multiple shifts. It's equipped with an advanced
  PC-based CNC control that provides an excellent motion control system, built around the High
  Definition Plasma Cutting process for ease of use, with fully automated process control for both
  oxy-fuel and plasma cutting. This versatile machine can run multiple processes, including plasma,
  oxy-fuel, plasma scribing, drilling, and contour bevel cutting. Its robust design allows for
  cutting thick material with both oxy-fuel and plasma.
heroImage: /images/machines/sti-200hd.jpg
heroImageAlt: Sector Technology STI-200HD heavy-duty CNC plasma and oxy-fuel cutting gantry on floor-mounted rails.

