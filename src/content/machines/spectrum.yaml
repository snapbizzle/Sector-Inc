standardEquipment:
  - Dual side-drive gantry, high-power 650-watt AC brushless drive
  - Welded, stress-relieved machined bridge beam
  - Hypertherm® EDGE Pro® PC-based numerical control with USB ports
  - Rack & pinion drive with precision planetary gear boxes
  - 2-inch stainless steel drive band for slave or mirror-image cutting
  - 18 homing positions and procedures to square gantry during setup
  - Air-blast and wiper system for clearing rails
  - Smooth and accurate motion with 11 bearings and multiple adjustments
  - Elevated 30 lbs./ft. machined "T" rails with adjustable leveling pads
  - 10-inch active matrix LCD touch screen
  - Wireless networking for CNC controller
  - Built-in water table height control
  - Power track guide to protect hoses and cables
  - Heat shields to protect cables and hoses from sparks
  - Job-loss recovery
  - Three-part automotive paint finish

optionalEquipment:
  - True Hole technology
  - X and Y axis plasma arc bevel stations
  - Straight-line plasma arc or oxy-fuel beveling
  - Triple-torch oxy-fuel bevel station
  - Advanced part nesting
  - Drill stations integrated with PLC
  - Laser pointer for plate alignment
  - 650-watt Kollmorgen AC brushless drive motors
  - Hose reel with hand torch for hand cutting
  - Plasma torch collision sensor with plasma systems
  - Precision micrometer-scaled piercing valve for oxy-fuel systems
  - Plasma, pneumatic, or paint marking
  - Heavy-duty water or downdraft table
  - Floor-mounted or overhead power track

