name: Spectrum
urlSlug: spectrum
tier: Mid-Heavy
tagline: The heaviest-duty cutting machine in its class, built for reliable multi-shift production.
overview: >-
  The Spectrum is the heaviest-duty cutting machine in its class — designed for manufacturers and
  fabricators that need a reliable, heavy-duty machine to run production for multiple shifts a day.
  The all-steel constructed gantry is dual-driven along a pedestal-mounted, heavy-duty elevator
  rail. The robust design allows for cutting thick material with both oxy-fuel and plasma. It's
  equipped with an advanced PC-based CNC control that provides an excellent motion control system,
  built around the High Definition Plasma Cutting process for ease of use, with fully automated
  process control for both oxy-fuel and plasma cutting. This versatile machine can run multiple
  processes, including plasma, oxy-fuel, plasma scribing, drilling, and bevel cutting.
heroImage: /images/machines/spectrum.jpg
heroImageAlt: Sector Technology Spectrum CNC plasma and oxy-fuel cutting gantry on a pedestal-mounted elevator rail.

